<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" aria-label="Open to Work badge">
  <defs>
    <path id="textCircle" d="M210,210 m-155,0 a155,155 0 1,1 310,0 a155,155 0 1,1 -310,0" />
  </defs>

  <!-- Anneau vert -->
  <circle cx="210" cy="210" r="170" fill="none" stroke="#506E3C" stroke-width="56"/>

  <!-- Texte circulaire blanc non souligné -->
<text font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
      font-size="26"
      font-weight="700"
      letter-spacing="3"
      fill="#ffffff"
      text-decoration="none">
  <textPath href="#textCircle"
            startOffset="40%"
            text-anchor="middle"
            text-decoration="none">
     OPEN TO WORK • OPEN TO WORK • OPEN TO WORK
  </textPath>
</text>

  <!-- Centre transparent -->
  <circle cx="210" cy="210" r="125" fill="transparent"/>
</svg>